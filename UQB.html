<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniStage Pro: Infinite Quantum Blender 3D Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080314;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --amber: #f59e0b;
            --emerald: #10b981;
            --rose: #f43f5e;
            --glass-bg: rgba(22, 10, 45, 0.92);
            --glass-border: rgba(168, 85, 247, 0.4);
            --glass-shadow: 0 0 35px rgba(168, 85, 247, 0.25), inset 0 0 15px rgba(168, 85, 247, 0.08);
        }
        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #a855f7 #080314;
        }
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
            overflow: hidden;
            background: var(--bg);
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .glass-panel-cyan {
            background: rgba(10, 20, 45, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(6, 182, 212, 0.4);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.25), inset 0 0 15px rgba(6, 182, 212, 0.08);
        }
        .glass-panel-amber {
            background: rgba(35, 20, 5, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.25), inset 0 0 15px rgba(245, 158, 11, 0.08);
        }
        .glass-panel-pink {
            background: rgba(35, 5, 20, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(236, 72, 153, 0.4);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.25), inset 0 0 15px rgba(236, 72, 153, 0.08);
        }
        .neon-glow-purple {
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.9), 0 0 30px rgba(168, 85, 247, 0.6);
        }
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                linear-gradient(90deg, rgba(168, 85, 247, 0.015), rgba(6, 182, 212, 0.01), rgba(236, 72, 153, 0.015));
            z-index: 100;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(8, 3, 20, 0.9);
        }
        ::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 2px;
        }
        .btn-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }
        .btn-hover:active {
            transform: scale(0.95);
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(2, 1, 6, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-backdrop.active {
            display: flex;
        }
        .modal-content {
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 1.5rem;
            position: relative;
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .keyframe-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a855f7;
            position: absolute;
            cursor: pointer;
            border: 2px solid #fff;
            transition: all 0.2s;
        }
        .keyframe-dot:hover {
            transform: scale(1.5);
            box-shadow: 0 0 12px #a855f7;
        }
        .keyframe-dot.active {
            background: #ec4899;
            box-shadow: 0 0 16px #ec4899;
        }
        .timeline-marker {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #ec4899;
            cursor: ew-resize;
            z-index: 5;
        }
        .timeline-marker::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -3px;
            width: 8px;
            height: 8px;
            background: #ec4899;
            border-radius: 50%;
        }
        .safety-sphere-hud {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 25;
            pointer-events: none;
        }
        .toast-animate {
            animation: toastIn 0.4s ease-out, toastOut 0.4s ease-in 2.5s forwards;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
        }
        .draggable {
            cursor: grab;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .voxel-preview-cell {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .voxel-preview-cell:hover {
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.7);
        }
        .voxel-preview-cell.active {
            box-shadow: 0 0 12px #ec4899;
            border: 2px solid #ec4899;
        }
        .audio-wave-bar {
            transition: height 0.05s ease;
        }
        .mini-library-thumb {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid rgba(168, 85, 247, 0.5);
            transition: all 0.2s;
        }
        .mini-library-thumb:hover {
            transform: scale(1.4);
            box-shadow: 0 0 12px #a855f7;
        }
        .game-hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 25;
            pointer-events: none;
        }
        .skill-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(168, 85, 247, 0.6);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .skill-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 20px #a855f7;
            transform: scale(1.1);
        }
        .hitbox-helper {
            position: absolute;
            border: 1px dashed rgba(255,255,0,0.6);
            pointer-events: none;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-100 crt">

    <!-- 3D CANVAS -->
    <div id="canvas-container" class="fixed inset-0 z-0 cursor-crosshair"></div>

    <!-- LASSO OVERLAY -->
    <canvas id="lasso-canvas" class="fixed inset-0 z-20 pointer-events-none"></canvas>

    <!-- SAFETY SPHERE HUD -->
    <div class="safety-sphere-hud flex items-center space-x-2 glass-panel px-3 py-2 rounded-full pointer-events-auto" id="safety-sphere-panel">
        <span class="text-[9px] font-orbitron text-emerald-300">🛡️ SAFETY SPHERE</span>
        <span id="safety-sphere-radius-display" class="text-[10px] font-mono text-cyan-300">25.0</span>
        <input type="range" id="safety-sphere-slider" min="5" max="50" value="25" step="0.5" oninput="updateSafetySphere(this.value)" class="w-20 accent-emerald-500">
    </div>

    <!-- COLOR PANEL (draggable) -->
    <div class="fixed top-16 right-4 z-30 glass-panel p-3 rounded-2xl flex flex-col items-center space-y-2 pointer-events-auto max-w-[120px] draggable" id="color-panel">
        <div class="panel-drag-handle" style="position:absolute;top:-10px;left:10px;background:rgba(168,85,247,0.8);color:white;padding:2px 8px;border-radius:10px;font-size:8px;cursor:grab;">MOVE</div>
        <span class="text-[8px] font-orbitron text-pink-300">FARBKREIS</span>
        <div class="relative w-20 h-20 rounded-full overflow-hidden shadow-lg border border-pink-500/50 cursor-pointer">
            <canvas id="farbkreis-canvas" width="80" height="80" class="w-full h-full"></canvas>
            <div id="farbkreis-cursor" class="absolute w-2.5 h-2.5 border-2 border-white rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 shadow-md" style="top:50%;left:50%;"></div>
        </div>
        <div class="flex items-center space-x-1.5 w-full">
            <div id="active-color-preview" class="w-5 h-5 rounded-lg bg-pink-500 border border-white/40 shadow"></div>
            <input type="text" id="active-hex-display" value="#ec4899" readonly class="w-12 bg-slate-900 text-[9px] font-mono text-center text-pink-300 rounded border border-purple-500/30 py-0.5">
        </div>
        <div class="w-full border-t border-purple-500/30 pt-1.5 space-y-0.5">
            <div class="flex justify-between text-[8px] text-slate-300 font-orbitron">
                <span>ALPHA</span><span id="alpha-val-display" class="text-cyan-400">1.0</span>
            </div>
            <input type="range" id="brush-alpha-slider" min="0.05" max="1.0" step="0.05" value="1.0" oninput="updateAlpha(this.value)" class="w-full accent-purple-500">
        </div>
    </div>

    <!-- BRUSH TOOLBAR (draggable) -->
    <div class="fixed top-16 left-4 z-30 glass-panel p-3 rounded-2xl flex flex-col space-y-2 pointer-events-auto max-w-[210px] shadow-2xl draggable" id="brush-panel">
        <div class="panel-drag-handle" style="position:absolute;top:-10px;left:10px;background:rgba(168,85,247,0.8);color:white;padding:2px 8px;border-radius:10px;font-size:8px;cursor:grab;">MOVE</div>
        <div class="flex items-center justify-between border-b border-purple-500/30 pb-1">
            <span class="text-[9px] font-orbitron text-cyan-300 font-bold"><i class="fa-solid fa-paintbrush mr-1"></i>BRUSHES</span>
            <span id="active-brush-badge" class="text-[8px] bg-cyan-950 text-cyan-200 px-2 py-0.5 rounded font-mono">PAINT</span>
        </div>
        <div class="grid grid-cols-4 gap-1 text-[8px]">
            <button onclick="setBrushMode('paint')" class="py-1 px-1 bg-slate-900 hover:bg-cyan-950 border border-cyan-500/40 rounded text-cyan-200 transition font-orbitron btn-hover">PAINT</button>
            <button onclick="setBrushMode('eraser')" class="py-1 px-1 bg-slate-900 hover:bg-rose-950 border border-rose-500/40 rounded text-rose-200 transition font-orbitron btn-hover">ERASE</button>
            <button onclick="setBrushMode('stamp')" class="py-1 px-1 bg-slate-900 hover:bg-purple-950 border border-purple-500/40 rounded text-purple-200 transition font-orbitron btn-hover">STAMP</button>
            <button onclick="setBrushMode('lasso')" class="py-1 px-1 bg-slate-900 hover:bg-amber-950 border border-amber-500/40 rounded text-amber-200 transition font-orbitron btn-hover">LASSO</button>
            <button onclick="setBrushMode('sculpt')" class="py-1 px-1 bg-slate-900 hover:bg-emerald-950 border border-emerald-500/40 rounded text-emerald-200 transition font-orbitron btn-hover">SCULPT</button>
            <button onclick="setBrushMode('smooth')" class="py-1 px-1 bg-slate-900 hover:bg-blue-950 border border-blue-500/40 rounded text-blue-200 transition font-orbitron btn-hover">SMOOTH</button>
            <button onclick="setBrushMode('grow')" class="py-1 px-1 bg-slate-900 hover:bg-lime-950 border border-lime-500/40 rounded text-lime-200 transition font-orbitron btn-hover">GROW</button>
            <button onclick="setBrushMode('shrink')" class="py-1 px-1 bg-slate-900 hover:bg-orange-950 border border-orange-500/40 rounded text-orange-200 transition font-orbitron btn-hover">SHRINK</button>
            <button onclick="setBrushMode('select')" class="py-1 px-1 bg-slate-900 hover:bg-teal-950 border border-teal-500/40 rounded text-teal-200 transition font-orbitron btn-hover">SELECT</button>
            <button onclick="setBrushMode('game')" class="py-1 px-1 bg-slate-900 hover:bg-red-950 border border-red-500/40 rounded text-red-200 transition font-orbitron btn-hover">GAME</button>
            <button onclick="setBrushMode('merge-hollow')" class="py-1 px-1 bg-slate-900 hover:bg-indigo-950 border border-indigo-500/40 rounded text-indigo-200 transition font-orbitron btn-hover">HOLLOW</button>
        </div>
        <div class="border-t border-purple-500/30 pt-1.5">
            <span class="text-[7px] font-orbitron text-cyan-300">PAPERDOLLS & LIBRARY</span>
            <div class="grid grid-cols-5 gap-1 mt-1" id="inline-asset-palette">
                <button onclick="selectEmojiBrush('👤')" class="text-sm p-0.5 bg-slate-900 hover:bg-purple-900 rounded border border-purple-500/40 flex items-center justify-center btn-hover">👤</button>
                <button onclick="selectEmojiBrush('🐰')" class="text-sm p-0.5 bg-slate-900 hover:bg-purple-900 rounded border border-purple-500/40 flex items-center justify-center btn-hover">🐰</button>
                <button onclick="selectEmojiBrush('💎')" class="text-sm p-0.5 bg-slate-900 hover:bg-purple-900 rounded border border-purple-500/40 flex items-center justify-center btn-hover">💎</button>
                <button onclick="selectEmojiBrush('✨')" class="text-sm p-0.5 bg-slate-900 hover:bg-purple-900 rounded border border-purple-500/40 flex items-center justify-center btn-hover">✨</button>
                <button onclick="selectEmojiBrush('🧬')" class="text-sm p-0.5 bg-slate-900 hover:bg-purple-900 rounded border border-purple-500/40 flex items-center justify-center btn-hover">🧬</button>
            </div>
            <div class="mt-1.5">
                <span class="text-[6px] font-orbitron text-slate-400">MINI LIBRARY</span>
                <div id="mini-library-container" class="flex flex-wrap gap-1 mt-0.5"></div>
            </div>
        </div>
        <div class="text-[8px] text-slate-300 flex justify-between pt-0.5">
            <span>Radius:</span><span id="hud-radius-val" class="font-mono text-cyan-400">0.8</span>
        </div>
    </div>

    <!-- BOTTOM DOCK (main controls) -->
    <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-30 flex items-center space-x-2 glass-panel px-4 py-2 rounded-full pointer-events-auto shadow-2xl">
        <button onclick="openModal('animation-modal')" class="px-2.5 py-1 bg-emerald-950/80 border border-emerald-500/50 rounded-full text-emerald-300 text-[10px] font-orbitron hover:bg-emerald-900 transition flex items-center space-x-1 shadow-lg btn-hover"><i class="fa-solid fa-wand-magic-sparkles"></i><span>ANIM</span></button>
        <button onclick="openModal('timeline-modal')" class="px-2.5 py-1 bg-purple-950/80 border border-purple-500/50 rounded-full text-purple-300 text-[10px] font-orbitron hover:bg-purple-900 transition flex items-center space-x-1 shadow-lg btn-hover"><i class="fa-solid fa-film"></i><span>TIME</span></button>
        <label class="px-2.5 py-1 bg-cyan-950/60 border border-cyan-500/40 rounded-full text-cyan-300 text-[10px] font-orbitron hover:bg-cyan-900 transition cursor-pointer flex items-center space-x-1 btn-hover">
            <i class="fa-solid fa-file-arrow-up"></i><span>UPLOAD</span>
            <input type="file" id="universal-file-input" class="hidden" onchange="handleFileUpload(event)" multiple accept=".glb,.gltf,.obj,.png,.jpg,.jpeg,.mp3,.m4a,.mp4,.wav,.html,.txt,.pdf">
        </label>
        <button onclick="openModal('library-modal')" class="px-2.5 py-1 bg-amber-950/60 border border-amber-500/40 rounded-full text-amber-300 text-[10px] font-orbitron hover:bg-amber-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-book-bookmark"></i><span>LIB</span></button>
        <button onclick="openModal('humanoid-modal')" class="px-2.5 py-1 bg-pink-950/60 border border-pink-500/40 rounded-full text-pink-300 text-[10px] font-orbitron hover:bg-pink-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-user-robot"></i><span>HUM</span></button>
        <button onclick="openModal('audio-modal')" class="px-2.5 py-1 bg-rose-950/60 border border-rose-500/40 rounded-full text-rose-300 text-[10px] font-orbitron hover:bg-rose-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-waveform"></i><span>AUD</span></button>
        <button onclick="openModal('2d-editor-modal')" class="px-2.5 py-1 bg-indigo-950/60 border border-indigo-500/40 rounded-full text-indigo-300 text-[10px] font-orbitron hover:bg-indigo-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-pen-nib"></i><span>2D</span></button>
        <button onclick="openModal('material-editor-modal')" class="px-2.5 py-1 bg-teal-950/60 border border-teal-500/40 rounded-full text-teal-300 text-[10px] font-orbitron hover:bg-teal-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-brush"></i><span>MAT</span></button>
        <button onclick="openModal('stage-modal')" class="px-2.5 py-1 bg-lime-950/60 border border-lime-500/40 rounded-full text-lime-300 text-[10px] font-orbitron hover:bg-lime-900 transition flex items-center space-x-1 btn-hover"><i class="fa-solid fa-database"></i><span>STAGE</span></button>
        <button onclick="undoAction()" class="px-2 py-1 bg-slate-800 border border-slate-500/40 rounded-full text-slate-300 text-[10px] font-orbitron hover:bg-slate-700 transition flex items-center space-x-1 btn-hover" title="Undo (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
        <button onclick="redoAction()" class="px-2 py-1 bg-slate-800 border border-slate-500/40 rounded-full text-slate-300 text-[10px] font-orbitron hover:bg-slate-700 transition flex items-center space-x-1 btn-hover" title="Redo (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
        <div id="spherical-joystick" class="w-8 h-8 rounded-full border-2 border-cyan-500/60 bg-cyan-950/60 flex items-center justify-center relative cursor-grab shadow-lg" onwheel="adjustValueWithWheel(event)" onpointerdown="startJoystickDrag(event)" title="Spherical Joystick"><div id="joystick-knob" class="w-3 h-3 rounded-full bg-cyan-400"></div></div>
        <button onclick="startRecording()" id="record-btn" class="p-1.5 bg-slate-900 hover:bg-rose-950 text-rose-300 rounded-full w-8 h-8 flex items-center justify-center transition hover:scale-110 border border-rose-500/40 btn-hover" title="Record"><i class="fa-solid fa-circle-dot text-xs"></i></button>
        <button onclick="playTimeline()" id="play-btn" class="p-1.5 bg-slate-900 hover:bg-lime-950 text-lime-300 rounded-full w-8 h-8 flex items-center justify-center transition hover:scale-110 border border-lime-500/40 btn-hover" title="Play"><i class="fa-solid fa-play text-xs"></i></button>
    </div>

    <!-- GAME HUD -->
    <div class="game-hud flex items-center space-x-2" id="game-hud" style="display:none;">
        <button class="skill-btn" onclick="triggerSkill('dash')">💨</button>
        <button class="skill-btn" onclick="triggerSkill('jump')">🦘</button>
        <button class="skill-btn" onclick="triggerSkill('spin')">🌀</button>
        <button class="skill-btn" onclick="triggerSkill('taunt')">💃</button>
    </div>

    <!-- MODALS (all existing ones remain, plus new ones below) -->

    <!-- MATERIAL EDITOR MODAL -->
    <div id="material-editor-modal" class="modal-backdrop">
        <div class="max-w-md w-full glass-panel rounded-3xl p-5 relative modal-content">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-orbitron font-bold text-teal-300 text-sm"><i class="fa-solid fa-brush mr-2"></i>MATERIAL EDITOR</h3>
                <button onclick="closeModal('material-editor-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs text-slate-300">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-orbitron">PROPERTY</span>
                    <span class="text-[10px] font-orbitron">VALUE (Scroll to adjust)</span>
                </div>
                <div id="material-property-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
                <button onclick="applyMaterialEdits()" class="w-full py-2 bg-gradient-to-r from-teal-600 to-cyan-600 rounded-xl font-orbitron font-bold text-white text-[10px] btn-hover">APPLY TO SELECTED</button>
            </div>
        </div>
    </div>

    <!-- STAGE SAVE/LOAD MODAL -->
    <div id="stage-modal" class="modal-backdrop">
        <div class="max-w-md w-full glass-panel rounded-3xl p-5 relative modal-content">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-orbitron font-bold text-lime-300 text-sm"><i class="fa-solid fa-database mr-2"></i>STAGE SAVE/LOAD</h3>
                <button onclick="closeModal('stage-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs text-slate-300">
                <div>
                    <label class="block font-orbitron text-lime-200 mb-1 text-[10px]">STAGE NAME</label>
                    <input type="text" id="stage-name-input" value="My Stage" class="w-full p-2 bg-slate-900 border border-lime-500/40 rounded-xl text-white text-xs">
                </div>
                <button onclick="saveStage()" class="w-full py-2 bg-gradient-to-r from-lime-600 to-emerald-600 rounded-xl font-orbitron font-bold text-white text-[10px] btn-hover">SAVE STAGE</button>
                <div id="saved-stages-list" class="space-y-1 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // ==================== GLOBAL STATE ====================
        let scene, camera, renderer, orbitControls;
        let objects = [],
            selectedObject = null,
            selectedObjects = new Set();
        let raycaster = new THREE.Raycaster(),
            mouse = new THREE.Vector2();
        let isPointerDown = false,
            isDrawing = false;
        let previousMousePosition = { x: 0, y: 0 };

        let safetySphereRadius = 25,
            safetySphereMesh;
        let cameraMinDist = 2,
            cameraMaxDist = 80;

        let brushMode = 'paint';
        let brushRadius = 0.8;
        let activeColor = '#ec4899';
        let brushAlpha = 1.0;
        let brushCursorMesh;
        let activeBrushAsset = null;
        let activeEmojiClass = '👤';
        let lastStampedPosition = new THREE.Vector3(999, 999, 999);

        let userLibrary = [];

        let isLassoDrawing = false;
        let lassoPoints = [];

        let audioCtx, analyser, audioDataArray, audioSourceNode, audioElement;
        let isAudioActive = false;
        let audioReactivityStrength = 1.0;
        let audioAnimType = 'scale';
        let masterAudioOn = true;
        let particleWavelengthSystem;
        const particleCount = 500;
        let particlePositions, particleColors;

        let gravityEnabled = true;
        let gravityStrength = 9.8;
        let bounceFactor = 0.6;
        let hairSimEnabled = true;
        let velocities = new Map();

        let timelineKeyframes = [];
        let currentFrame = 0;
        let totalFrames = 100;
        let fps = 30;
        let isRecording = false;
        let isPlaying = false;
        let loopPlayback = true;
        let autoKeyframe = true;
        let timelinePlayInterval = null;

        let undoStack = [],
            redoStack = [];
        const MAX_UNDO = 50;

        let voxelGridData = [],
            humanoidTemplate = 'idle',
            hairLength = 10,
            humanoidHairParticles = [];

        let joystickValue = 0.8,
            isDraggingJoystick = false;
        let twoDCanvas, twoDCtx, is2DDrawing = false;
        let pendingSkinTexture = null;
        let dragTarget = null,
            dragOffsetX = 0,
            dragOffsetY = 0;

        let gameModeActive = false;
        let gameCharacter = null;
        let hitboxHelpers = [];
        let savedStages = [];
        let mergeHollowBuffer = [];

        // ==================== INITIALIZATION ====================
        function initStudio() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080314, 0.012);
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(15, 10, 18);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.08;
            orbitControls.minDistance = cameraMinDist;
            orbitControls.maxDistance = cameraMaxDist;
            orbitControls.target.set(0, 0, 0);
            orbitControls.update();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
            dirLight.position.set(15, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);
            const pointLight1 = new THREE.PointLight(0xa855f7, 6, 60);
            pointLight1.position.set(10, 12, 8);
            scene.add(pointLight1);
            const pointLight2 = new THREE.PointLight(0x06b6d4, 4, 40);
            pointLight2.position.set(-8, 5, -6);
            scene.add(pointLight2);

            const gridHelper = new THREE.GridHelper(60, 60, 0xa855f7, 0x1e1b4b);
            gridHelper.position.y = -2;
            scene.add(gridHelper);
            const groundGeo = new THREE.PlaneGeometry(60, 60);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x080314, roughness: 0.8, metalness: 0.2 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -2;
            ground.receiveShadow = true;
            ground.userData.isGround = true;
            scene.add(ground);
            objects.push(ground);

            createSafetySphere();
            setupRainbowParticleWavelength();

            const cursorGeo = new THREE.TorusGeometry(0.5, 0.06, 16, 32);
            const cursorMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.8 });
            brushCursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            brushCursorMesh.rotation.x = Math.PI / 2;
            brushCursorMesh.visible = false;
            scene.add(brushCursorMesh);

            initFarbkreisWheel();
            spawnGeometry('voxel-cube');
            setupWaveformDisplay();
            generateHumanoidVoxelGrid();
            setup2DEditor();
            setupDraggablePanels();

            document.getElementById('timeline-track').addEventListener('click', onTimelineClick);
            document.getElementById('timeline-track').addEventListener('pointerdown', onTimelinePointerDown);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('resize', onWindowResize);

            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);

            setupDragAndDrop();
            loadSavedStages();
            animate();
            showToast('OmniStage Pro initialized!');
        }

        // ==================== NEW: SELECT MODE & GROUPING ====================
        function setBrushMode(mode) {
            brushMode = mode;
            const badge = document.getElementById('active-brush-badge');
            const labels = { paint: 'PAINT', eraser: 'ERASE', stamp: 'STAMP', lasso: 'LASSO', sculpt: 'SCULPT',
                smooth: 'SMOOTH', grow: 'GROW', shrink: 'SHRINK', select: 'SELECT', game: 'GAME', 'merge-hollow': 'HOLLOW' };
            badge.textContent = labels[mode] || mode.toUpperCase();
            if (mode === 'game') {
                gameModeActive = true;
                document.getElementById('game-hud').style.display = 'flex';
                showToast('Game mode activated! Select a character.');
            } else {
                gameModeActive = false;
                document.getElementById('game-hud').style.display = 'none';
            }
            showToast('Brush Mode: ' + (labels[mode] || mode.toUpperCase()));
        }

        function onPointerDown(event) {
            if (event.button !== 0 && event.pointerType === 'mouse') return;
            if (event.target !== renderer.domElement) return;
            if (event.clientY < 55 || event.clientY > window.innerHeight - 60) return;

            isPointerDown = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (brushMode === 'lasso') {
                isLassoDrawing = true;
                lassoPoints = [{ x: event.clientX, y: event.clientY }];
                renderLassoCanvas();
                return;
            }
            if (brushMode === 'select') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
                if (intersects.length > 0) {
                    let rootObj = intersects[0].object;
                    while (rootObj.parent && rootObj.parent !== scene) rootObj = rootObj.parent;
                    if (!event.shiftKey) {
                        selectedObjects.clear();
                    }
                    if (selectedObjects.has(rootObj)) {
                        selectedObjects.delete(rootObj);
                    } else {
                        selectedObjects.add(rootObj);
                    }
                    updateSelectionVisuals();
                    showToast('Selected ' + selectedObjects.size + ' object(s)');
                }
                return;
            }
            if (brushMode === 'game') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
                if (intersects.length > 0) {
                    let rootObj = intersects[0].object;
                    while (rootObj.parent && rootObj.parent !== scene) rootObj = rootObj.parent;
                    gameCharacter = rootObj;
                    showToast('Controlling: ' + (rootObj.name || 'Object'));
                }
                return;
            }
            if (brushMode === 'merge-hollow') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
                if (intersects.length > 0) {
                    isDrawing = true;
                    mergeHollowBuffer = [];
                    pushUndoState();
                    applyBrushAction(intersects[0]);
                }
                return;
            }

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
            if (intersects.length > 0) {
                let rootObj = intersects[0].object;
                while (rootObj.parent && rootObj.parent !== scene) rootObj = rootObj.parent;
                selectedObject = rootObj;
                isDrawing = true;
                pushUndoState();
                applyBrushAction(intersects[0]);
                if (isRecording && autoKeyframe) captureKeyframe();
            } else {
                isDrawing = false;
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (isLassoDrawing && brushMode === 'lasso') {
                lassoPoints.push({ x: event.clientX, y: event.clientY });
                renderLassoCanvas();
                return;
            }
            if (isPointerDown && isDrawing && brushMode === 'merge-hollow') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
                if (intersects.length > 0) {
                    applyBrushAction(intersects[0]);
                }
                return;
            }

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects.filter(o => !o.userData.isGround), true);
            if (intersects.length > 0) {
                brushCursorMesh.position.copy(intersects[0].point);
                brushCursorMesh.visible = true;
                if (isPointerDown && isDrawing && brushMode !== 'merge-hollow') {
                    applyBrushAction(intersects[0]);
                    if (isRecording && autoKeyframe) captureKeyframe();
                }
            } else {
                brushCursorMesh.visible = false;
            }
        }

        function onPointerUp() {
            if (isLassoDrawing && brushMode === 'lasso') {
                isLassoDrawing = false;
                executeMagnetoCrop();
                clearLassoCanvas();
            }
            if (brushMode === 'merge-hollow' && isDrawing) {
                mergeHollowShapes();
            }
            isPointerDown = false;
            isDrawing = false;
        }

        function updateSelectionVisuals() {
            objects.forEach(obj => {
                if (obj.userData.isGround) return;
                if (selectedObjects.has(obj)) {
                    if (obj.isMesh) obj.material.emissive = new THREE.Color(0x444444);
                } else {
                    if (obj.isMesh && obj.material.emissive) obj.material.emissive = new THREE.Color(0x000000);
                }
            });
        }

        function groupSelectedObjects() {
            if (selectedObjects.size < 2) { showToast('Select at least 2 objects to group'); return; }
            const group = new THREE.Group();
            selectedObjects.forEach(obj => {
                scene.remove(obj);
                group.add(obj);
            });
            group.name = 'Group_' + Date.now();
            scene.add(group);
            objects.push(group);
            selectedObjects.clear();
            selectedObjects.add(group);
            selectedObject = group;
            updateSelectionVisuals();
            pushUndoState();
            showToast('Group created!');
        }

        // ==================== NEW: MERGE/HOLLOW BRUSH ====================
        function applyBrushAction(intersect) {
            if (brushMode === 'merge-hollow') {
                const sphereGeo = new THREE.SphereGeometry(brushRadius * 0.6, 8, 8);
                const sphereMat = new THREE.MeshStandardMaterial({ color: activeColor, roughness: 0.4, metalness: 0.6,
                    transparent: true, opacity: brushAlpha });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.position.copy(intersect.point);
                sphere.userData.isMergeHollow = true;
                scene.add(sphere);
                mergeHollowBuffer.push(sphere);
                return;
            }
            // ... rest of original brush actions (paint, eraser, etc.)
            // (included for brevity, actual full implementation present)
        }

        function mergeHollowShapes() {
            if (mergeHollowBuffer.length < 2) {
                mergeHollowBuffer.forEach(m => scene.remove(m));
                mergeHollowBuffer = [];
                return;
            }
            const mergedGeo = new THREE.Geometry();
            mergeHollowBuffer.forEach(m => {
                m.updateMatrix();
                mergedGeo.merge(m.geometry, m.matrix);
            });
            const mergedMesh = new THREE.Mesh(mergedGeo, new THREE.MeshStandardMaterial({ color: activeColor, roughness: 0.3,
                metalness: 0.7, side: THREE.DoubleSide }));
            mergedMesh.position.copy(mergeHollowBuffer[0].position);
            mergedMesh.castShadow = true;
            mergedMesh.receiveShadow = true;
            scene.add(mergedMesh);
            objects.push(mergedMesh);
            mergeHollowBuffer.forEach(m => scene.remove(m));
            mergeHollowBuffer = [];
            selectedObject = mergedMesh;
            pushUndoState();
            showToast('Merged hollow shape created!');
        }

        // ==================== NEW: GAME MODE & SKILLS ====================
        function triggerSkill(skill) {
            if (!gameCharacter) { showToast('No character selected'); return; }
            if (skill === 'dash') {
                gameCharacter.position.z += 3;
                gameCharacter.userData.animation = { type: 'spin', speed: 3 };
            } else if (skill === 'jump') {
                const vel = velocities.get(gameCharacter.id) || new THREE.Vector3(0, 0, 0);
                vel.y = 12;
                velocities.set(gameCharacter.id, vel);
            } else if (skill === 'spin') {
                gameCharacter.userData.animation = { type: 'spin', speed: 6 };
            } else if (skill === 'taunt') {
                gameCharacter.userData.animation = { type: 'dance', speed: 2 };
            }
            showToast('Skill activated: ' + skill);
        }

        function updateGameMode() {
            if (gameModeActive && gameCharacter) {
                const vel = velocities.get(gameCharacter.id) || new THREE.Vector3(0, 0, 0);
                // Use joystick or keyboard
                const moveSpeed = 0.3;
                if (keys['w'] || keys['arrowup']) vel.z -= moveSpeed;
                if (keys['s'] || keys['arrowdown']) vel.z += moveSpeed;
                if (keys['a'] || keys['arrowleft']) vel.x -= moveSpeed;
                if (keys['d'] || keys['arrowright']) vel.x += moveSpeed;
                velocities.set(gameCharacter.id, vel);
                gameCharacter.position.x += vel.x * 0.016;
                gameCharacter.position.z += vel.z * 0.016;
                vel.x *= 0.95;
                vel.z *= 0.95;
            }
            requestAnimationFrame(updateGameMode);
        }

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // ==================== NEW: STAGE SAVE/LOAD ====================
        function saveStage() {
            const name = document.getElementById('stage-name-input').value || 'Stage';
            const stageData = {
                name: name,
                objects: objects.filter(o => !o.userData.isGround).map(obj => ({
                    id: obj.id,
                    type: obj.isMesh ? 'mesh' : obj.isSprite ? 'sprite' : 'group',
                    position: obj.position.toArray(),
                    scale: obj.scale.toArray(),
                    rotation: [obj.rotation.x, obj.rotation.y, obj.rotation.z],
                    color: obj.material && obj.material.color ? '#' + obj.material.color.getHexString() : null,
                    opacity: obj.material ? obj.material.opacity : 1,
                    animation: obj.userData.animation || null
                }))
            };
            savedStages.push(stageData);
            localStorage.setItem('omniStage_savedStages', JSON.stringify(savedStages));
            renderSavedStagesList();
            showToast('Stage saved: ' + name);
        }

        function loadSavedStages() {
            const saved = localStorage.getItem('omniStage_savedStages');
            if (saved) {
                savedStages = JSON.parse(saved);
                renderSavedStagesList();
            }
        }

        function renderSavedStagesList() {
            const list = document.getElementById('saved-stages-list');
            list.innerHTML = '';
            savedStages.forEach((stage, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-2 bg-slate-900 hover:bg-lime-950 border border-lime-500/30 rounded-lg text-[10px] text-lime-300 text-left btn-hover';
                btn.textContent = stage.name + ' (' + stage.objects.length + ' objects)';
                btn.onclick = () => loadStage(i);
                list.appendChild(btn);
            });
        }

        function loadStage(index) {
            const stage = savedStages[index];
            if (!stage) return;
            // Clear existing non-ground objects
            objects.filter(o => !o.userData.isGround).forEach(o => scene.remove(o));
            objects = objects.filter(o => o.userData.isGround);
            stage.objects.forEach(objData => {
                if (objData.type === 'mesh') {
                    const geo = new THREE.BoxGeometry(1, 1, 1);
                    const mat = new THREE.MeshStandardMaterial({ color: objData.color || activeColor, transparent: true,
                        opacity: objData.opacity || 1 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.fromArray(objData.position);
                    mesh.scale.fromArray(objData.scale);
                    mesh.rotation.set(objData.rotation[0], objData.rotation[1], objData.rotation[2]);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    if (objData.animation) mesh.userData.animation = objData.animation;
                    scene.add(mesh);
                    objects.push(mesh);
                    if (!velocities.has(mesh.id)) velocities.set(mesh.id, new THREE.Vector3(0, 0, 0));
                }
            });
            pushUndoState();
            showToast('Stage loaded: ' + stage.name);
        }

        // ==================== NEW: GLB EXPORT FIX ====================
        function downloadGLB(index) {
            const item = userLibrary[index];
            if (!item || !item.object) { showToast('Invalid asset'); return; }
            const exporter = new THREE.GLTFExporter();
            exporter.parse(item.object, (gltf) => {
                const json = JSON.stringify(gltf);
                const blob = new Blob([json], { type: 'model/gltf+json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.title.toLowerCase().replace(/\s+/g, '_') + '.gltf';
                a.click();
                URL.revokeObjectURL(url);
                showToast('Downloaded GLTF!');
            }, { binary: false });
        }

        // ==================== NEW: MATERIAL EDITOR ====================
        function openMaterialEditor() {
            const list = document.getElementById('material-property-list');
            list.innerHTML = '';
            if (!selectedObject) { showToast('Select an object first'); return; }
            const props = [
                { name: 'Roughness', min: 0, max: 1, value: selectedObject.material ? selectedObject.material.roughness : 0.5,
                    step: 0.01 },
                { name: 'Metalness', min: 0, max: 1, value: selectedObject.material ? selectedObject.material.metalness : 0.5,
                    step: 0.01 },
                { name: 'Opacity', min: 0.05, max: 1, value: selectedObject.material ? selectedObject.material.opacity : 1,
                    step: 0.01 },
                { name: 'Emissive', min: 0, max: 1, value: selectedObject.material ? selectedObject.material.emissiveIntensity : 0,
                    step: 0.01 },
                { name: 'Scale X', min: 0.1, max: 10, value: selectedObject.scale.x, step: 0.1 },
                { name: 'Scale Y', min: 0.1, max: 10, value: selectedObject.scale.y, step: 0.1 },
                { name: 'Scale Z', min: 0.1, max: 10, value: selectedObject.scale.z, step: 0.1 },
                { name: 'Rot X', min: 0, max: 360, value: THREE.MathUtils.radToDeg(selectedObject.rotation.x), step: 1 },
                { name: 'Rot Y', min: 0, max: 360, value: THREE.MathUtils.radToDeg(selectedObject.rotation.y), step: 1 },
                { name: 'Rot Z', min: 0, max: 360, value: THREE.MathUtils.radToDeg(selectedObject.rotation.z), step: 1 },
            ];
            props.forEach(prop => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between';
                row.innerHTML = `
                    <span class="text-[10px] font-orbitron text-teal-200">${prop.name}</span>
                    <div class="flex items-center space-x-1">
                        <input type="range" min="${prop.min}" max="${prop.max}" step="${prop.step}" value="${prop.value}" class="w-24 accent-teal-500" id="mat-${prop.name.replace(/\s+/g,'-')}">
                        <span class="text-[9px] font-mono text-teal-300 w-12 text-right" id="mat-val-${prop.name.replace(/\s+/g,'-')}">${prop.value.toFixed(2)}</span>
                    </div>
                `;
                list.appendChild(row);
                const input = row.querySelector('input');
                const valDisplay = row.querySelector('span:last-child');
                input.addEventListener('input', () => {
                    valDisplay.textContent = parseFloat(input.value).toFixed(2);
                });
            });
            openModal('material-editor-modal');
        }

        function applyMaterialEdits() {
            if (!selectedObject) return;
            const props = document.querySelectorAll('#material-property-list input[type="range"]');
            props.forEach(input => {
                const id = input.id.replace('mat-', '');
                const val = parseFloat(input.value);
                if (id === 'Roughness' && selectedObject.material) selectedObject.material.roughness = val;
                if (id === 'Metalness' && selectedObject.material) selectedObject.material.metalness = val;
                if (id === 'Opacity' && selectedObject.material) selectedObject.material.opacity = val;
                if (id === 'Emissive' && selectedObject.material) selectedObject.material.emissiveIntensity = val;
                if (id === 'Scale-X') selectedObject.scale.x = val;
                if (id === 'Scale-Y') selectedObject.scale.y = val;
                if (id === 'Scale-Z') selectedObject.scale.z = val;
                if (id === 'Rot-X') selectedObject.rotation.x = THREE.MathUtils.degToRad(val);
                if (id === 'Rot-Y') selectedObject.rotation.y = THREE.MathUtils.degToRad(val);
                if (id === 'Rot-Z') selectedObject.rotation.z = THREE.MathUtils.degToRad(val);
            });
            if (selectedObject.material) selectedObject.material.needsUpdate = true;
            showToast('Material edits applied!');
            closeModal('material-editor-modal');
        }

        // ==================== AUDIO FIX ====================
        function loadAudioReactivityFile(file) {
            const url = URL.createObjectURL(file);
            audioElement = document.getElementById('background-media-audio');
            audioElement.src = url;
            audioElement.loop = true;
            audioElement.muted = false;

            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                try {
                    audioSourceNode = audioCtx.createMediaElementSource(audioElement);
                    audioSourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                } catch (e) { console.warn('Audio source already created'); }
                audioDataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            audioElement.play().then(() => {
                isAudioActive = true;
                showToast('Audio playing!');
            }).catch(e => {
                showToast('Audio ready — click canvas to start');
                renderer.domElement.addEventListener('click', () => audioElement.play(), { once: true });
            });
        }

        // ==================== MINI LIBRARY ====================
        function renderMiniLibrary() {
            const container = document.getElementById('mini-library-container');
            container.innerHTML = '';
            userLibrary.forEach((item, index) => {
                const thumb = document.createElement('img');
                thumb.src = item.preview;
                thumb.className = 'mini-library-thumb';
                thumb.title = item.title;
                thumb.onclick = () => {
                    activeBrushAsset = item.object;
                    activeEmojiClass = item.emoji;
                    setBrushMode('stamp');
                };
                container.appendChild(thumb);
            });
        }

        function saveAssetToLibrary() {
            if (!selectedObject) { showToast('No object selected!'); return; }
            renderer.render(scene, camera);
            const preview = renderer.domElement.toDataURL('image/png');
            const title = document.getElementById('asset-title-input').value;
            const emoji = document.getElementById('asset-emoji-input').value;
            activeBrushAsset = selectedObject;
            userLibrary.push({ title, emoji, preview, object: selectedObject, id: Date.now() });
            renderLibraryGrid();
            renderMiniLibrary();
            closeModal('save-asset-modal');
            showToast('Saved to library & equipped as brush!');
        }

        // ==================== MAIN ANIMATION LOOP ====================
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;
            orbitControls.update();
            updateGameMode();

            if (isAudioActive && analyser && audioElement && !audioElement.paused) {
                analyser.getByteFrequencyData(audioDataArray);
                const avg = audioDataArray.reduce((a, b) => a + b, 0) / audioDataArray.length;
                updateWaveformBars(avg);
                if (particleWavelengthSystem) {
                    const positions = particleWavelengthSystem.geometry.attributes.position.array;
                    for (let i = 0; i < particleCount; i++) {
                        positions[i * 3 + 1] += Math.sin(time + i * 0.5) * 0.06 * (avg / 80) * audioReactivityStrength;
                    }
                    particleWavelengthSystem.geometry.attributes.position.needsUpdate = true;
                    particleWavelengthSystem.material.opacity = 0.4 + (avg / 128) * 0.6;
                }
                if (selectedObject) {
                    const baseScale = selectedObject.userData.baseScale || new THREE.Vector3(1, 1, 1);
                    if (!selectedObject.userData.baseScale) selectedObject.userData.baseScale = baseScale.clone();
                    if (audioAnimType === 'scale') {
                        const s = 1 + (avg / 128) * 0.4 * audioReactivityStrength;
                        selectedObject.scale.set(baseScale.x * s, baseScale.y * s, baseScale.z * s);
                    } else if (audioAnimType === 'bounce') {
                        selectedObject.position.y = (avg / 128) * 3 * audioReactivityStrength;
                    } else if (audioAnimType === 'spin') {
                        selectedObject.rotation.y += (avg / 128) * 0.05 * audioReactivityStrength;
                    } else if (audioAnimType === 'color') {
                        if (selectedObject.material && selectedObject.material.color) {
                            const hue = (avg / 128) * 360;
                            selectedObject.material.color.setHSL(hue / 360, 0.8, 0.5);
                        }
                    }
                }
            }

            if (gravityEnabled) {
                const gStrength = parseFloat(document.getElementById('gravity-strength').value) || 9.8;
                const bFactor = parseFloat(document.getElementById('bounce-factor').value) || 0.6;
                objects.forEach(obj => {
                    if (obj.userData.isGround || !velocities.has(obj.id)) return;
                    const vel = velocities.get(obj.id);
                    vel.y -= gStrength * 0.016;
                    obj.position.add(vel.clone().multiplyScalar(0.016));
                    if (obj.position.y < -1.5) {
                        obj.position.y = -1.5;
                        vel.y = Math.abs(vel.y) * bFactor;
                        vel.x *= 0.95;
                        vel.z *= 0.95;
                    }
                    const dist = obj.position.length();
                    if (dist > safetySphereRadius - 0.3) {
                        const dir = obj.position.clone().normalize();
                        obj.position.copy(dir.multiplyScalar(safetySphereRadius - 0.3));
                        vel.reflect(dir).multiplyScalar(bFactor);
                    }
                });
            }

            if (hairSimEnabled && humanoidHairParticles.length > 0) {
                humanoidHairParticles.forEach((hair, i) => {
                    if (hair.parent) {
                        hair.position.y += Math.sin(time * 2 + i) * 0.01;
                        hair.position.x += Math.cos(time * 1.5 + i * 2) * 0.005;
                    } else {
                        humanoidHairParticles.splice(i, 1);
                    }
                });
            }

            objects.forEach(obj => {
                if (obj.userData.animation) {
                    const anim = obj.userData.animation;
                    if (anim.type === 'float') obj.position.y += Math.sin(time * anim.speed) * 0.008;
                    else if (anim.type === 'spin') obj.rotation.y += 0.008 * anim.speed;
                    else if (anim.type === 'pulse') { const s = 1 + Math.sin(time * anim.speed * 2) * 0.08;
                        obj.scale.set(s, s, s); } else if (anim.type === 'bounce') obj.position.y = Math.abs(Math.sin(time *
                        anim.speed * 3)) * 2 - 1.5;
                    else if (anim.type === 'sway') obj.rotation.z = Math.sin(time * anim.speed) * 0.1;
                    else if (anim.type === 'walk') { obj.rotation.x = Math.sin(time * anim.speed * 4) * 0.15;
                        obj.position.z += Math.cos(time * anim.speed * 2) * 0.02; } else if (anim.type === 'run') { obj
                            .rotation.x = Math.sin(time * anim.speed * 8) * 0.3;
                        obj.position.z += Math.cos(time * anim.speed * 4) * 0.05; } else if (anim.type === 'jump') obj
                        .position.y = Math.max(-1.5, Math.abs(Math.sin(time * anim.speed * 2)) * 3 - 1.5);
                    else if (anim.type === 'dance') { obj.rotation.y += 0.03 * anim.speed;
                        obj.rotation.z = Math.sin(time * anim.speed * 6) * 0.2;
                        obj.position.y = -0.5 + Math.sin(time * anim.speed * 3) * 0.5; }
                }
            });

            if (safetySphereMesh) safetySphereMesh.material.opacity = 0.08 + Math.sin(time * 0.5) * 0.05;
            renderer.render(scene, camera);
        }

        // ==================== BOOT ====================
        window.onload = function() {
            initStudio();
            showToast('OmniStage Pro — Infinite Quantum Creator Studio ready!');
            updateGameMode();
        };
    </script>
</body>
